services:
  - type: web
    name: ansemmas
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/site.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: PUBLIC_URL
        value: https://ansemmas.fun
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
